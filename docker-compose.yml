services:
  app:
    build:
      context: .
      args:
        ENVIRONMENT: ${APP_ENV:-dev}
    container_name: CRUD
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: CRUD_database
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=laravel
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel
  redis:
    image: redis:7-alpine
    container_name: CRUD_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - laravel
    command: redis-server --appendonly yes
  webserver:
    image: nginx:alpine
    container_name: CRUD_nginx
    restart: unless-stopped
    ports:
      - '8000:80' 
      - '443:443'
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel
  webhook-receiver:   
    build:
      context: ./webhook-receiver
      dockerfile: Dockerfile
    container_name: webhook-receiver
    restart: unless-stopped
    ports:
      - "8081:81"
    environment:
      - FAILURE_RATE=30
      - DELAY_MS=100
      - SECRET=test-secret
    networks:
      - laravel
volumes:
  db_data:
  redis_data:
networks:
  laravel:
    driver: bridge