name: CRUD
on: 
  push:
    branches: [deploy.v2]
  pull_request:
    branches: [deploy.v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout mode
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd
          tools: pint, composer:v2
      - name: Run Pint
        run: pint
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Copy .env
        run: cp .env.example .env

      - name: Start Docker Compose
        run: docker-compose up -d

      - name: Wait for database
        run: |
          echo "Waiting for database..."
          for i in {1..30}; do
            if docker exec CRUD_database mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; then
              echo "Database is ready"
              break
            fi
            echo "Attempt $i: Database not ready"
            sleep 3
          done

      - name: Install dependencies
        run: docker exec CRUD composer install --no-interaction --no-progress

      - name: Generate app key
        run: docker exec CRUD php artisan key:generate --force

      - name: Run migrations
        run: docker exec CRUD php artisan migrate --seed --force

      - name: Run tests
        run: docker exec CRUD php artisan test

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose logs ==="
          docker-compose logs --tail=100

      - name: Cleanup
        if: always()
        run: docker-compose down -v
