name: CRUD
on: 
  push:
    branches: [deploy.v2]
  pull_request:
    branches: [deploy.v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mode
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd
          tools: composer:v2
      - name: Install Pint
        run: composer require --dev laravel/pint --no-interaction
      - name: Run Pint
        run: ./vendor/bin/pint --test || true

  tests:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd, pcntl
          tools: composer:v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Start services
        run: docker-compose up -d

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate --seed --force
        env:
          DB_HOST: mysql
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: redis
          QUEUE_CONNECTION: redis
          APP_ENV: testing

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: mysql
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: redis
          QUEUE_CONNECTION: redis
          APP_ENV: testing
          APP_URL: http://localhost:8000

      - name: Cleanup
        if: always()
        run: docker-compose down -v
