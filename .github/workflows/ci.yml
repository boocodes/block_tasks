name: CRUD
on: 
  push:
    branches: [deploy.v2]
  pull_request:
    branches: [deploy.v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd
          tools: composer:v2
      - name: Install Pint
        run: composer require --dev laravel/pint --no-interaction
      
      - name: Run Pint
        run: ./vendor/bin/pint

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd, pcntl
          tools: composer:v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d
          echo "Services started"

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready"
          for i in {1..30}; do
            if docker exec $(docker ps -q -f name=mysql) mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: MySQL not ready"
            sleep 3
          done

      - name: Wait for Redis
        run: |
          echo "Waiting for Redis to be ready"
          for i in {1..30}; do
            if docker exec $(docker ps -q -f name=redis) redis-cli ping; then
              echo "Redis is ready!"
              break
            fi
            echo "Attempt $i: Redis not ready"
            sleep 3
          done

      - name: Wait for webhook-receiver
        run: |
          echo "Waiting for webhook-receiver to be ready"
          for i in {1..30}; do
            if curl -s -f http://localhost:8081/ > /dev/null 2>&1; then
              echo "webhook-receiver is ready"
              break
            fi
            echo "Attempt $i: webhook-receiver not ready"
            sleep 2
          done

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --no-interaction
        
      - name: Generate app key
        run: php artisan key:generate --force

      - name: Install MySQL Client
        run: sudo apt-get install -y mysql-client

      - name: Create storage link
        run: php artisan storage:link

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run migrations
        run: php artisan migrate --seed --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PORT: 3306
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: redis
          APP_ENV: testing

      - name: Add webhook-receiver alias
        run: |
          echo "127.0.0.1 webhook-receiver" | sudo tee -a /etc/hosts
          cat /etc/hosts | grep webhook-receiver

      - name: Test webhook-receiver
        run: |
          echo "Testing webhook-receiver endpoints"
          
          PAYLOAD='{"event":"test","status":"ok"}'
          SECRET='secret-test'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8081/ \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIGNATURE" \
            -d "$PAYLOAD")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Webhook-receiver works correctly"
          else
            echo "Webhook-receiver returned $HTTP_CODE"
            exit 1
          fi

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PORT: 3306
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: redis
          APP_ENV: testing
          APP_URL: http://localhost:8000

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v
