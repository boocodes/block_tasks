name: CRUD
on: 
  push:
    branches: [deploy.v2]
  pull_request:
    branches: [deploy.v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout mode
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd
          tools: pint, composer:v2
      - name: Run Pint
        run: pint
  tests:
    runs-on: ubuntu-latest
    needs: lint
    services: 
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: application
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options:
          --health-cmd="redis-cli ping"
    steps:
      - name: Checkout mode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: 
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, redis, zip, gd, pcntl
          tools: composer:v2

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependecies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Install MySQL Client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL ready
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do 
          echo "Waiting for MySQL"
          sleep 5
          done
      - name: Intall Redis tool
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
      - name: Wait for Redis ready
        run: |
          echo "Waitng for redis to be ready"
          until redis-cli -h 127.0.0.1 ping; do
            echo "Redis is not ready"
            sleep 3
          done
          echo "Redis ready to work"
        
      - name: Key generate
        run: php artisan key:generate

      - name: Create storage link
        run: php artisan storage:link

      - name: Clear config cache
        run: php artisan config:clear

      - name: Build and run webhook-receiver
        run: |
          docker stop webhook-receiver-container 2>/dev/null || true
          docker rm webhook-receiver-container 2>/dev/null || true
          
          echo "Building webhook-receiver from ./webhook-receiver..."
          docker build -t webhook-receiver:latest ./webhook-receiver
          
          docker run -d \
            --name webhook-receiver-container \
            -p 8081:81 \
            webhook-receiver:latest
          
          echo "Webhook-receiver container started"
      - name: Wait for webhook-receiver
        run: |
          echo "Waiting for webhook-receiver to be ready"
          for i in {1..30}; do
            if curl -s -f http://localhost:8081/health > /dev/null 2>&1; then
              echo "webhook-receiver is ready!"
              break
            fi
            echo "Attempt $i: webhook-receiver not ready"
            sleep 2
          done
      - name: Test webhook-receiver endpoint
        run: |
          echo "Testing webhook-receiver endpoint..."
          
          # Тест 1: Проверка доступности
          echo "Test 1: Checking availability..."
          if curl -s -f http://localhost:8081/ > /dev/null 2>&1; then
            echo "Webhook is accessible"
          else
            echo "Webhook is not accessible"
            exit 1
          fi
          
          echo "Test 2: Testing with valid signature"
          PAYLOAD='{"event":"test","status":"ok"}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "secret-test" | awk '{print $2}')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8081/ \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIGNATURE" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Valid signature test passed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
          else
            echo "Valid signature test failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi
      - name: Migrations
        run: php artisan migrate --seed
        env: 
          DB_HOST: 127.0.0.1
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PORT: 3306
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: redis
      
      - name : tests
        run: php artisan test
        env: 
          DB_HOST: 127.0.0.1
          DB_DATABASE: application
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PORT: 3306
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: redis
          APP_ENV: testing
      
          
